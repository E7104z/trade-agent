name: Trade Agent intraday paper check

on:
  schedule:
    # Every 5 minutes during US market hours (13:00-20:59 UTC = 09:00-16:59 ET
    # during EDT). GitHub does NOT guarantee this granularity: scheduled runs
    # are queued on shared infrastructure and short intervals are frequently
    # delayed or dropped entirely under load. Treat each tick as best-effort.
    # The runner lane is built for that - it re-checks its own window on every
    # invocation and anchors detection to the bar where conditions first held,
    # not to the tick that happened to notice.
    - cron: "*/5 13-20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A delayed tick must not pile up behind a running one.
  group: intraday-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check open paper orders and run the intraday lane
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.TRADE_AGENT_CRON_SECRET }}
          BASE_URL: ${{ secrets.TRADE_AGENT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "::error::TRADE_AGENT_URL secret is not set — nothing to call."
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::TRADE_AGENT_CRON_SECRET secret is not set — the endpoint will 401."
            exit 1
          fi
          # Fail loudly on a non-2xx so a broken cron shows up as a red run
          # rather than a silent no-op, and print the body so the runner
          # result is visible in the Actions log.
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/cron/intraday-check"
          echo
